name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      # Public build-time config. Non-secret placeholders are fine for CI; the
      # Phase 0 build does not talk to Supabase. Real values live in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    # Job-level env so the step `if` can read it (secrets aren't available in a
    # step-level `if` directly). Empty when the secret isn't configured.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      # Cheap, secret-free guard: no two migrations may share a number
      # (NNNN_*.sql). A duplicate silently shadows/reorders a migration — the
      # real footgun. Gaps are harmless (Supabase applies in filename order).
      - name: Validate migration numbering
        run: |
          set -euo pipefail
          nums=$(ls supabase/migrations/*.sql | sed -E 's#.*/([0-9]+)_.*#\1#' | sort)
          dupes=$(echo "$nums" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration numbers: $dupes"; exit 1
          fi
          echo "Migration numbering OK ($(echo "$nums" | wc -l | tr -d ' ') files, no duplicates)."

      # Schema-drift gate against the linked project. Runs only when the Supabase
      # access token is configured as a repo secret; otherwise it's skipped so
      # the workflow stays green until the credential is provisioned.
      - name: Supabase schema dry-run
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest db push --dry-run

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # High/critical advisories fail the job; lower severities are reported only.
      # Overrides and the documented exception list live in the root
      # package.json (pnpm.overrides / pnpm.auditConfig.ignoreGhsas) and are
      # justified per advisory in docs/security.md#dependency-policy-pnpm-audit.
      - name: Audit (high & critical)
        run: pnpm audit --audit-level high

      # Visibility only: moderate/low advisories must not silently accumulate.
      - name: Audit report (all severities, non-blocking)
        if: always()
        run: pnpm audit || true
